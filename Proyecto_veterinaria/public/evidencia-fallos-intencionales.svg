  <rect width="1200" height="300" rx="18" fill="#f6f0ed"/>
  <rect x="26" y="24" width="1148" height="252" rx="12" fill="#211b1a"/>
  <rect x="26" y="24" width="1148" height="44" rx="12" fill="#3b2b28"/>
  <circle cx="52" cy="46" r="7" fill="#e57a65"/>
  <circle cx="76" cy="46" r="7" fill="#e4bd5c"/>
