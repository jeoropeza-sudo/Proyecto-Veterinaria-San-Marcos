<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Veterinaria San Marcos</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/Styles.css">
</head>

<body style="background-color: #EAEFF4; min-height: 100vh;" class="d-flex flex-column justify-content-between">

  <div id="header-contenedor"></div>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card border-0 shadow-lg rounded-4 p-4">
          <div class="card-body">
            
            <h2 class="fw-bold text-center mb-2" style="color: #153259;">Crear Cuenta</h2>
            <p class="text-center text-muted mb-4">Ingresa tus datos para registrarte en el sistema</p>

            <form id="form-registro" novalidate>
              
              <div class="mb-3">
                <label for="registro-run" class="form-label fw-bold" style="color: #3B6D8C;">RUN / RUT (sin puntos ni guion)</label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="registro-run" 
                  placeholder="19012345K" 
                  maxlength="10" 
                  required
                >
                <small id="error-registro-run" class="text-danger mt-1 d-block"></small>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="registro-nombre" class="form-label fw-bold" style="color: #3B6D8C;">Nombre</label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="registro-nombre" 
                    placeholder="Juan" 
                    maxlength="50"
                    required
                  >
                  <small id="error-registro-nombre" class="text-danger mt-1 d-block"></small>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="registro-apellidos" class="form-label fw-bold" style="color: #3B6D8C;">Apellidos</label>
                  <input 
                    type="text" 
                    class="form-control" 
                    id="registro-apellidos" 
                    placeholder="Pérez González" 
                    maxlength="100"
                    required
                  >
                  <small id="error-registro-apellidos" class="text-danger mt-1 d-block"></small>
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="registro-correo" class="form-label fw-bold" style="color: #3B6D8C;">Correo Electrónico</label>
                  <input 
                    type="email" 
                    class="form-control" 
                    id="registro-correo" 
                    placeholder="ejemplo@correo.cl" 
                    maxlength="100"
                    required
                  >
                  <small id="error-registro-correo" class="text-danger mt-1 d-block"></small>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="registro-fecha-nac" class="form-label fw-bold" style="color: #3B6D8C;">Fecha de Nacimiento (Opcional)</label>
                  <input 
                    type="date" 
                    class="form-control" 
                    id="registro-fecha-nac"
                  >
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="select-region" class="form-label fw-bold" style="color: #3B6D8C;">Región</label>
                  <select class="form-select" id="select-region" required>
                    <option value="">Seleccione Región</option>
                  </select>
                  <small id="error-registro-region" class="text-danger mt-1 d-block"></small>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="select-comuna" class="form-label fw-bold" style="color: #3B6D8C;">Comuna</label>
                  <select class="form-select" id="select-comuna" required>
                    <option value="">Seleccione Comuna</option>
                  </select>
                  <small id="error-registro-comuna" class="text-danger mt-1 d-block"></small>
                </div>
              </div>

              <div class="mb-3">
                <label for="registro-direccion" class="form-label fw-bold" style="color: #3B6D8C;">Dirección</label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="registro-direccion" 
                  placeholder="Av. Providencia 1234, Dpto 502" 
                  maxlength="300"
                  required
                >
                <small id="error-registro-direccion" class="text-danger mt-1 d-block"></small>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="registro-pass" class="form-label fw-bold" style="color: #3B6D8C;">Contraseña</label>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="registro-pass" 
                    placeholder="••••••••" 
                    minlength="4"
                    maxlength="10"
                    required
                  >
                  <small id="error-registro-pass" class="text-danger mt-1 d-block"></small>
                </div>
                <div class="col-md-6 mb-4">
                  <label for="registro-confirm-pass" class="form-label fw-bold" style="color: #3B6D8C;">Confirmar Contraseña</label>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="registro-confirm-pass" 
                    placeholder="••••••••" 
                    minlength="4"
                    maxlength="10"
                    required
                  >
                  <small id="error-registro-confirm-pass" class="text-danger mt-1 d-block"></small>
                </div>
              </div>

              <button type="submit" class="btn btn-lg w-100 text-white fw-bold mb-3" style="background-color: #04BFAD;">
                Registrarse
              </button>
            </form>

            <div class="text-center pt-3 border-top">
              <p class="mb-0 text-muted">
                ¿Ya tienes una cuenta? 
                <a href="login.html" class="fw-bold text-decoration-none" style="color: #36BBD9;">Inicia sesión aquí</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-contenedor"></div>

  <script src="../Js/hf-script.js" id="script-hf" data-base="../"></script>
  <script src="../Js/regiones.js"></script>
  <script src="../Js/registro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
