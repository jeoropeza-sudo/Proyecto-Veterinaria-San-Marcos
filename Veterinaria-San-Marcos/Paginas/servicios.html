<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Médicos | Veterinaria San Marcos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Ajusta esta ruta si tu carpeta se llama "css" o "Css" -->
    <link rel="stylesheet" href="../Css/servicios.css">
</head>
<body>
    <!-- Contenedor del Header dinámico -->
    <div id="header-contenedor"></div>

    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">Servicios Médicos y Prestaciones</h1>
            <p class="text-muted">Explora y programa consultas, cirugías, exámenes o vacunas para tu mascota.</p>
        </div>

        <!-- Cuadrícula donde se inyectarán las categorías o tarjetas -->
        <div class="row g-4" id="contenedor-servicios">
            <!-- Dinámico mediante JS -->
        </div>

        <!-- Sección de Reserva Preliminar con LocalStorage -->
        <section class="mt-5 p-4 bg-light rounded shadow-sm">
            <h3 class="h4 mb-3">📋 Reserva Preliminar de Servicios</h3>
            <ul id="lista-reserva" class="list-group mb-3">
                <li class="list-group-item text-muted">No hay servicios seleccionados.</li>
            </ul>
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold fs-5" id="total-reserva">Total: $0</span>
                <button class="btn btn-danger btn-sm" id="btn-vaciar">Vaciar Reserva</button>
            </div>
        </section>
    </main>

    <!-- Contenedor del Footer dinámico -->
    <div id="footer-contenedor"></div>

    <!-- Scripts en orden lógico y limpio (ajusta los "../" si tu archivo está en otra carpeta) -->
    <script src="../Js/catalogo-datos.js"></script>
    <script src="../Js/almacenamiento.js"></script>
    <script src="../Js/catalogo.js"></script>
    <script src="../Js/hf-script.js" id="script-hf" data-base="../"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Inicializador con la nueva función de categorías -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderizarCategoriasServicios("contenedor-servicios");
            actualizarVistaReservaGlobal();
            
            document.getElementById("btn-vaciar")?.addEventListener("click", vaciarStorage);
        });
    </script>
</body>
</html>
