<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../Css/servicios.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <div id="header-contenedor"></div>

    <main class="container my-5 flex-grow-1">
        <div class="card shadow-sm border-0 p-4 p-lg-5 bg-white">
            <div class="row align-items-center g-5">
                
                <div class="col-lg-5 text-center">
                    <img id="imagen" class="img-fluid rounded-3 shadow-sm object-fit-cover w-100" style="max-height: 380px;" alt="Producto" onerror="this.src='https://via.placeholder.com/400x350?text=Sin+Imagen'">
                </div>

                <div class="col-lg-7">
                    <span class="badge bg-secondary mb-2">Detalle de Producto</span>
                    <h1 id="nombre" class="fw-bold mb-3" style="color: #153259;"></h1>
                    <h3 id="precio" class="fw-bold mb-4" style="color: #04BFAD;"></h3>
                    
                    <h5 class="fw-bold text-dark mb-2">Descripción y Presentación:</h5>
                    <p id="descripcion" class="text-muted mb-4 lead fs-6"></p>

                    <div class="d-flex flex-wrap gap-3">
                        <button id="btn-agregar-reserva" class="btn text-white fw-bold px-4 py-3 shadow-sm" style="background-color: #153259;">
                            Agregar al carrito
                        </button>
                        <a href="productos.html" class="btn btn-outline-secondary fw-bold px-4 py-3">
                            Volver al catálogo
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="footer-contenedor"></div>

    <script src="../Js/reserva-storage.js"></script>
    <script src="../Js/detalle-producto.js"></script>
    <script src="../Js/hf-script.js" id="script-hf" data-base="../"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
</body>
</html>
