<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Veterinaria San Marcos</title>
  
  <!-- CDN Bootstrap 5.3.8 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
  <!-- Tu CSS personalizado con la paleta de colores -->
  <link rel="stylesheet" href="../Css/contacto.css">
</head>
<body>

  <!-- Encabezado / Navegación con color #153259 -->
  <header class="header-custom text-white py-2">
    <nav class="navbar navbar-expand-lg navbar-dark container">
      <a class="navbar-brand fw-bold" href="../index.html">Veterinaria San Marcos</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        
        <!-- Título con Cyan brillante #36BBD9 -->
        <h1 class="mb-3 title-custom fw-bold">Contáctanos</h1>
        <p class="text-secondary mb-4">Envíanos tus dudas o consultas sobre nuestros servicios veterinarios en Rancagua.</p>

        <form id="form-contacto" class="card p-4 shadow-sm border-0" novalidate>
          
          <!-- RUN / RUT -->
          <div class="mb-3">
            <label for="run" class="form-label text-dark fw-medium">RUN (sin puntos ni guión):</label>
            <input type="text" class="form-control" id="run" name="run" placeholder="Ej: 19876543K" required>
            <div class="text-danger small mt-1" id="error-run"></div>
          </div>

          <!-- Nombre Completo -->
          <div class="mb-3">
            <label for="nombre" class="form-label text-dark fw-medium">Nombre Completo:</label>
            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
            <div class="text-danger small mt-1" id="error-nombre"></div>
          </div>

          <!-- Correo Electrónico -->
          <div class="mb-3">
            <label for="correo" class="form-label text-dark fw-medium">Correo Electrónico:</label>
            <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            <div class="text-danger small mt-1" id="error-correo"></div>
          </div>

          <!-- Teléfono de Contacto -->
          <div class="mb-3">
            <label for="telefono" class="form-label text-dark fw-medium">Teléfono de Contacto:</label>
            <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: +56912345678" required>
            <div class="text-danger small mt-1" id="error-telefono"></div>
          </div>

          <!-- Tipo de Consulta -->
          <div class="mb-3">
            <label for="asunto" class="form-label text-dark fw-medium">Tipo de Consulta:</label>
            <select class="form-select" id="asunto" name="asunto" required>
              <option value="">Selecciona una opción</option>
              <option value="Consulta General">Consulta General</option>
              <option value="Servicios y Precios">Servicios y Precios</option>
              <option value="Urgencias">Información sobre Urgencias</option>
              <option value="Reclamo o Sugerencia">Reclamo o Sugerencia</option>
            </select>
            <div class="text-danger small mt-1" id="error-asunto"></div>
          </div>

          <!-- Mensaje / Comentario -->
          <div class="mb-3">
            <label for="mensaje" class="form-label text-dark fw-medium">Mensaje o Comentario:</label>
            <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
            <div class="text-danger small mt-1" id="error-mensaje"></div>
          </div>

          <!-- Botón Verde Turquesa -->
          <button type="submit" class="btn btn-custom w-100 py-2">Enviar Consulta</button>
          <div id="exito-mensaje" class="alert alert-success mt-3 d-none" role="alert"></div>

        </form>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white text-center py-3 border-top mt-auto">
    <p class="m-0 text-muted">&copy; 2026 Veterinaria San Marcos - Rancagua, Chile.</p>
  </footer>

  <!-- CDN Bootstrap 5.3.8 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
  <!-- Tu JS de validaciones -->
  <script src="../Js/hf-script.js"></script>
</body>
</html>
