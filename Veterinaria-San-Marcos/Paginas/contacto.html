<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Veterinaria San Marcos</title>
  <link rel="stylesheet" href="contacto.css">
</head>
<body>

  <!-- Encabezado / Navegación -->
  <header class="main-header">
    <nav class="navbar">
      <div class="logo">
        <a href="index.html">Veterinaria San Marcos</a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="contacto.html" class="active">Contacto</a></li>
        <li><a href="login.html">Iniciar Sesión</a></li>
      </ul>
    </nav>
  </header>

  <!-- Contenido Principal -->
  <main class="container">
    <section class="contact-section">
      <h1>Contáctanos</h1>
      <p>Envíanos tus dudas o consultas sobre nuestros servicios veterinarios en Rancagua.</p>

      <form id="form-contacto" class="form-container" novalidate>
        
        <!-- RUN / RUT -->
        <div class="form-group">
          <label for="run">RUN (sin puntos ni guión):</label>
          <input type="text" id="run" name="run" placeholder="Ej: 19876543K" required>
          <small class="error-message" id="error-run"></small>
        </div>

        <!-- Nombre Completo -->
        <div class="form-group">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
          <small class="error-message" id="error-nombre"></small>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label for="correo">Correo Electrónico:</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
          <small class="error-message" id="error-correo"></small>
        </div>

        <!-- Teléfono de Contacto -->
        <div class="form-group">
          <label for="telefono">Teléfono de Contacto:</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej: +56912345678" required>
          <small class="error-message" id="error-telefono"></small>
        </div>

        <!-- Tipo de Consulta -->
        <div class="form-group">
          <label for="asunto">Tipo de Consulta:</label>
          <select id="asunto" name="asunto" required>
            <option value="">Selecciona una opción</option>
            <option value="Consulta General">Consulta General</option>
            <option value="Servicios y Precios">Servicios y Precios</option>
            <option value="Urgencias">Información sobre Urgencias</option>
            <option value="Reclamo o Sugerencia">Reclamo o Sugerencia</option>
          </select>
          <small class="error-message" id="error-asunto"></small>
        </div>

        <!-- Mensaje / Comentario -->
        <div class="form-group">
          <label for="mensaje">Mensaje o Comentario:</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
          <small class="error-message" id="error-mensaje"></small>
        </div>

        <!-- Botón de Envío -->
        <button type="submit" class="btn-submit">Enviar Consulta</button>
        <div id="exito-mensaje" class="success-message" style="display: none;"></div>

      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Veterinaria San Marcos - Rancagua, Chile.</p>
  </footer>

  <script src="js/contacto.js"></script>
</body>
</html>
