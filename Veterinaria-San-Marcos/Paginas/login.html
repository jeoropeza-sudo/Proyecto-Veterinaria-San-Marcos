<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Veterinaria San Marcos</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../Css/Styles.css">
</head>

<body style="background-color: #EAEFF4; min-height: 100vh;" class="d-flex flex-column justify-content-between">

  <!-- Header Dinámico -->
  <div id="header-contenedor"></div>

  <!-- Contenido Principal -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 p-4">
          <div class="card-body">
            
            <h2 class="fw-bold text-center mb-2" style="color: #153259;">Iniciar Sesión</h2>
            <p class="text-center text-muted mb-4">Ingresa tus credenciales para acceder al sistema</p>

            <form id="form-login">
              <div class="mb-3">
                <label for="login-correo" class="form-label fw-bold" style="color: #3B6D8C;">Correo Electrónico</label>
                <input 
                  type="email" 
                  class="form-control form-control-lg" 
                  id="login-correo" 
                  placeholder="ejemplo@correo.cl" 
                  required
                >
                <small id="error-login-correo" class="text-danger mt-1 d-block"></small>
              </div>

              <div class="mb-4">
                <label for="login-pass" class="form-label fw-bold" style="color: #3B6D8C;">Contraseña</label>
                <input 
                  type="password" 
                  class="form-control form-control-lg" 
                  id="login-pass" 
                  placeholder="••••••••" 
                  required
                >
                <small id="error-login-pass" class="text-danger mt-1 d-block"></small>
              </div>

              <button type="submit" class="btn btn-lg w-100 text-white fw-bold mb-3" style="background-color: #04BFAD;">
                Ingresar
              </button>
            </form>

            <div class="text-center pt-3 border-top">
              <p class="mb-0 text-muted">
                ¿Aún no tienes cuenta? 
                <a href="registro.html" class="fw-bold text-decoration-none" style="color: #36BBD9;">Regístrate aquí</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Dinámico -->
  <div id="footer-contenedor"></div>

  <!-- Scripts -->
  <script src="../Js/hf-script.js" id="script-hf" data-base="../"></script>
  <script src="../Js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
